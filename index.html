<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Links</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #ccc;
      margin-bottom: 30px;
    }

    a {
      display: block;
      max-width: 340px;
      margin: 14px auto;
      padding: 14px 18px;
      border: 1px solid white;
      border-radius: 999px;
      color: white;
      text-decoration: none;
      font-size: 16px;
    }

    a:hover {
      background: white;
      color: #111;
    }
  </style>
</head>

<body>
  <h1>Your Name / Project</h1>
  <p>Music · Events · Contact</p>

  <a href="https://instagram.com/yourname">Instagram</a>
  <a href="https://open.spotify.com/">Spotify</a>
  <a href="https://bandcamp.com/">Bandcamp</a>
  <a href="mailto:hello@yourdomain.com">Contact</a>
</body>
</html>
